<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div
        class="mx-auto bg-white p-5 shadow-sm rounded border"
        style="max-width: 600px"
      >
        <h1 class="text-center mb-5 fs-2">Roth IRA Calculator</h1>
        <main>
          <form action="#" method="POST">
            <div class="row mb-3">
              <label for="balance" class="col-sm-5 col-form-label"
                >Balance ($)</label
              >
              <div class="col-sm-7">
                <input type="number" id="balance" class="form-control" />
              </div>
            </div>

            <div class="row mb-3">
              <label for="contribution" class="col-sm-5 col-form-label"
                >Annual Contribution ($)</label
              >
              <div class="col-sm-7">
                <input type="number" id="contribution" class="form-control" />
              </div>
            </div>

            <fieldset class="row mb-3">
              <legend class="col-form-label col-sm-5 pt-0">
                Maximize contributions?
              </legend>
              <div class="col-sm-7">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="maximize"
                    id="yes"
                  />
                  <label class="form-check-label" for="yes">Yes</label>
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="maximize"
                    id="no"
                  />
                  <label class="form-check-label" for="no">No</label>
                </div>
              </div>
            </fieldset>

            <div class="row mb-3">
              <label for="rate" class="col-sm-5 col-form-label"
                >Expected return (%)</label
              >
              <div class="col-sm-7">
                <input type="number" id="rate" class="form-control" />
              </div>
            </div>

            <div class="row mb-3">
              <label for="currentAge" class="col-sm-5 col-form-label"
                >Current age</label
              >
              <div class="col-sm-7">
                <input type="number" id="currentAge" class="form-control" />
              </div>
            </div>

            <div class="row mb-3">
              <label for="retirementAge" class="col-sm-5 col-form-label"
                >Retirement age</label
              >
              <div class="col-sm-7">
                <input type="number" id="retirementAge" class="form-control" />
              </div>
            </div>

            <div class="row mb-4">
              <label for="taxRate" class="col-sm-5 col-form-label"
                >Tax rate (%)</label
              >
              <div class="col-sm-7">
                <input type="number" id="taxRate" class="form-control" />
              </div>
            </div>

            <div class="row g-2">
              <div class="col-6">
                <button type="submit" class="btn btn-primary w-100">
                  Calculate
                </button>
              </div>
              <div class="col-6">
                <button
                  type="reset"
                  class="btn btn-outline-secondary w-100 text-secondary"
                >
                  Reset
                </button>
              </div>
            </div>

            <div class="mt-4 pt-3">
              <p class="text-muted mb-0" style="font-size: 0.9rem">
                This exercise is a simplified version of the Roth IRA Calculator
                <a
                  href="https://www.calculator.net/roth-ira-calculator.html"
                  target="_blank"
                  class="text-decoration-underline text-primary"
                  >Calculator.net</a
                >
              </p>
            </div>
          </form>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
